[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tplqt"
version = "1.0.0"
description = "Task-parameterised learning and generation of spatula strokes for automated solid sampling"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jasper Tan", email = "zhen.tan@epfl.ch" }]
keywords = ["learning from demonstration", "task-parameterised model", "optimal control",
            "laboratory automation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
viz = ["rerun-sdk>=0.32"]
test = ["pytest>=7.0"]

[project.scripts]
tplqt = "tplqt.cli:main"

[tool.setuptools]
packages = ["tplqt"]

[tool.setuptools.package-data]
tplqt = ["calibrations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
